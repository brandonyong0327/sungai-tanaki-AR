name: sync site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: fetch bundle
        run: curl -L -o bundle.zip https://github.com/brandonyong0327/sungai-tanaki-AR/releases/download/models-v1/site-bundle.zip
      - name: unpack
        run: unzip -o bundle.zip -d . && rm bundle.zip
      - name: commit
        run: |
          git config user.name actions
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "sync site and animated models" || true
          git push
