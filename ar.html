<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sungai Tanaki · AR</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  :root{--gold:#e9b548;--orange:#ee9a35;--orange2:#e5842a;--cream:#f4ecdc;--muted:#a9c0a4;}
  html,body{margin:0;height:100%;width:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;
            color:#fff;position:fixed;inset:0;overscroll-behavior:none;font-size:18px}
  /* 相机画面强制铺满全屏（安卓竖屏常见「只剩一条细条」就是这里） */
  video{position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;
        object-fit:cover!important;object-position:center!important;z-index:-2!important;background:#000}
  a-scene{position:fixed!important;inset:0;width:100%!important;height:100%!important;display:block}
  .a-canvas{width:100%!important;height:100%!important;display:block}

  #hud{position:fixed;left:0;right:0;top:0;padding:12px;display:flex;justify-content:space-between;
       align-items:center;z-index:6;pointer-events:none;gap:8px}
  #hud > *{pointer-events:auto}
  .pill{color:var(--cream);text-decoration:none;background:rgba(14,35,24,.72);padding:11px 16px;border-radius:999px;
        font-size:1rem;font-weight:600;border:1px solid rgba(233,181,72,.3);font-family:inherit;cursor:pointer;
        backdrop-filter:blur(6px)}
  #langbar{display:flex;gap:6px}
  #langbar button{opacity:.65;min-width:56px;text-align:center}
  #langbar button.on{opacity:1;background:linear-gradient(135deg,var(--gold),var(--orange2));color:#2a1a05;font-weight:800;border-color:transparent}

  #tip{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);max-width:94vw;text-align:center;
       background:rgba(14,35,24,.78);padding:13px 22px;border-radius:999px;font-size:1.05rem;z-index:6;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(233,181,72,.25)}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;
       background:#0e2318;z-index:9;text-align:center;line-height:1.7;font-size:1.1rem;color:var(--cream)}
  #err h3{font-size:1.35rem;margin-bottom:12px;color:var(--gold2)}
  #dbg{position:fixed;left:8px;bottom:72px;z-index:7;font:12px/1.5 ui-monospace,monospace;
       background:rgba(0,0,0,.65);padding:6px 8px;border-radius:8px;display:none;white-space:pre}
</style>
</head>
<body>
  <div id="hud">
    <a class="pill" id="homeBtn" href="index.html">‹ Home</a>
    <div id="langbar"></div>
    <button class="pill" id="soundBtn">🔊</button>
  </div>

  <div id="tip"></div>
  <div id="dbg"></div>
  <div id="err"></div>

  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no;"
           embedded vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false"
           renderer="colorManagement: true; antialias: true; physicallyCorrectLights: true">
    <a-light type="ambient" intensity="1.15"></a-light>
    <a-light type="directional" position="0 2 1" intensity="1.5"></a-light>
    <a-camera></a-camera>

    <a-entity id="anchor0"  mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="anchor1"  mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="anchor2"  mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity id="anchor3"  mindar-image-target="targetIndex: 3"></a-entity>
    <a-entity id="anchor4"  mindar-image-target="targetIndex: 4"></a-entity>
    <a-entity id="anchor5"  mindar-image-target="targetIndex: 5"></a-entity>
    <a-entity id="anchor6"  mindar-image-target="targetIndex: 6"></a-entity>
    <a-entity id="anchor7"  mindar-image-target="targetIndex: 7"></a-entity>
    <a-entity id="anchor8"  mindar-image-target="targetIndex: 8"></a-entity>
    <a-entity id="anchor9"  mindar-image-target="targetIndex: 9"></a-entity>
    <a-entity id="anchor10" mindar-image-target="targetIndex: 10"></a-entity>
    <a-entity id="anchor11" mindar-image-target="targetIndex: 11"></a-entity>
  </a-scene>

  <audio id="narration" preload="auto" loop></audio>

  <script src="config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let lang = params.get("lang") || localStorage.getItem("lang") || "en";
    if (!CONFIG.languages.some(l => l.code === lang)) lang = CONFIG.languages[0].code;
    const T = CONFIG.ui[lang] || CONFIG.ui.en;

    const audio  = document.getElementById("narration");
    const tip    = document.getElementById("tip");
    const errBox = document.getElementById("err");
    const loaded = {};
    let muted = false, activePage = null;

    const fill = (s, n) => s.replace("{n}", n);

    // ---- 顶栏 / 语言按钮 ----
    document.getElementById("homeBtn").textContent = "‹ " + T.home;
    const langbar = document.getElementById("langbar");
    CONFIG.languages.forEach(L => {
      const b = document.createElement("button");
      b.className = "pill" + (L.code === lang ? " on" : "");
      b.textContent = L.label;
      b.title = L.native;
      b.onclick = () => {
        lang = L.code;
        localStorage.setItem("lang", lang);
        location.href = "ar.html?lang=" + lang;
      };
      langbar.appendChild(b);
    });

    function setTipIdle(){ tip.textContent = "🔍 " + T.tipIdle; }
    setTipIdle();

    function playNarration(pageNo) {
      const p = CONFIG.pages[pageNo - 1];
      const src = p && p.audio[lang];
      if (!src) return;
      audio.src = src;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function buildModel(anchorIndex, pageNo) {
      const p = CONFIG.pages[pageNo - 1];
      const anchor = document.getElementById("anchor" + anchorIndex);
      if (!p || !anchor) return;
      const m = document.createElement("a-gltf-model");
      m.setAttribute("src", p.model);
      m.setAttribute("position", "0 0.1 0");
      m.setAttribute("scale", "0.21 0.21 0.21");
      m.addEventListener("model-error", () => { tip.textContent = "⚠️ " + fill(T.tipMissing, pageNo); });
      m.addEventListener("model-loaded", () => { tip.textContent = "✅ " + fill(T.tipReady, pageNo); startAnim(m); });
      anchor.appendChild(m);
    }

    // ---- 模型自带动画 ----
    const sceneEl = document.querySelector("a-scene");
    const mixers = [];
    const clipIndex = (CONFIG.animClip === undefined) ? 0 : CONFIG.animClip;

    function startAnim(entity) {
      if (clipIndex < 0) return;
      const obj = entity.getObject3D("mesh");
      if (!obj || !obj.animations || !obj.animations.length) return;
      const mixer = new THREE.AnimationMixer(obj);
      mixer.clipAction(obj.animations[Math.min(clipIndex, obj.animations.length - 1)]).play();
      mixers.push(mixer);
    }
    sceneEl.addEventListener("tick", (e) => {
      const dt = (e.detail.timeDelta || 16) / 1000;
      for (let i = 0; i < mixers.length; i++) mixers[i].update(dt);
    });

    function onFound(anchorIndex) {
      const pageNo = CONFIG.targetMap[anchorIndex];
      if (!pageNo) return;
      if (activePage === pageNo) return;
      activePage = pageNo;
      if (!loaded[pageNo]) {
        tip.textContent = "⏳ " + fill(T.tipLoading, pageNo);
        buildModel(anchorIndex, pageNo);
        loaded[pageNo] = true;
      } else {
        tip.textContent = "✅ " + fill(T.tipReady, pageNo);
      }
      playNarration(pageNo);
    }

    function onLost(anchorIndex) {
      const pageNo = CONFIG.targetMap[anchorIndex];
      if (!pageNo || activePage !== pageNo) return;
      activePage = null;
      setTipIdle();
      audio.pause();
      audio.currentTime = 0;
    }

    for (let i = 0; i < 12; i++) {
      const el = document.getElementById("anchor" + i);
      if (!el) continue;
      el.addEventListener("targetFound", () => onFound(i));
      el.addEventListener("targetLost",  () => onLost(i));
    }

    // ---- 调试面板（网址加 ?debug=1）----
    const dbgEl = document.getElementById("dbg");
    if (params.get("debug") === "1") {
      dbgEl.style.display = "block";
      setInterval(() => {
        const s = sceneEl.systems["mindar-image-system"];
        const v = s && s.video;
        const r = v ? v.getBoundingClientRect() : null;
        dbgEl.textContent =
          "video " + (v ? v.videoWidth + "×" + v.videoHeight : "-") +
          "\ndraw  " + (r ? Math.round(r.width) + "×" + Math.round(r.height) : "-") +
          "\nview  " + innerWidth + "×" + innerHeight +
          "\nfound " + (activePage || "-");
      }, 700);
    }

    // ---- 相机画面尺寸修正 ----
    function refit(){
      const sys = sceneEl.systems["mindar-image-system"];
      if (!sys || !sys.video || !sys.video.videoWidth) return;
      try { sys._resize(); } catch (e) {}
    }
    sceneEl.addEventListener("arReady", () => {
      refit();
      [300, 800, 1600, 2600].forEach(t => setTimeout(refit, t));
    });
    window.addEventListener("orientationchange", () => setTimeout(refit, 300));
    window.addEventListener("resize", () => setTimeout(refit, 200));

    // 相机打不开 → 提示
    sceneEl.addEventListener("arError", () => {
      errBox.style.display = "flex";
      errBox.innerHTML = "<div><h3>" + T.errTitle + "</h3>" + T.errBody + "</div>";
    });

    document.getElementById("soundBtn").onclick = () => {
      muted = !muted;
      audio.muted = muted;
      document.getElementById("soundBtn").textContent = muted ? "🔇" : "🔊";
    };

    window.addEventListener("touchstart", function unlock(){
      audio.play().then(() => audio.pause()).catch(() => {});
    }, { once: true });
  </script>
</body>
</html>
