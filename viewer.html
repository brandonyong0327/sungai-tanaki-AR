<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sungai Tanaki · 3D</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<style>
  :root{--gold:#e9b548;--gold2:#f6cf76;--orange:#ee9a35;--orange2:#e5842a;--cream:#f4ecdc;--muted:#a9c0a4;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:var(--cream);font-size:18px}
  #bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 26%,rgba(28,58,40,.9),rgba(14,35,24,.95) 70%);z-index:-1}
  #bg-art{position:fixed;inset:-12%;z-index:-2;background:url('assets/pages/cover.jpg') center/cover no-repeat;
          filter:blur(30px) saturate(1.15);opacity:.22;transform:scale(1.12)}
  #hud{position:fixed;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between;
       align-items:center;z-index:5;gap:8px}
  .pill{color:var(--cream);background:rgba(14,35,24,.72);padding:11px 16px;border-radius:999px;font-size:1rem;
        font-weight:600;text-decoration:none;border:1px solid rgba(233,181,72,.3);font-family:inherit;cursor:pointer;
        backdrop-filter:blur(6px)}
  #langbar{display:flex;gap:6px}
  #langbar button{opacity:.65;min-width:56px;padding:9px 12px}
  #langbar button.on{opacity:1;background:linear-gradient(135deg,var(--gold),var(--orange2));color:#2a1a05;font-weight:800;border-color:transparent}
  #info{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;text-align:center;
        width:100%;padding:0 16px}
  #title{font-family:Georgia,serif;font-size:1.45rem;font-weight:800;margin-bottom:4px;color:var(--cream)}
  #sub{font-size:.95rem;color:var(--muted)}
  #nav{display:flex;gap:10px;justify-content:center;margin-top:12px}
  #nav button{background:rgba(14,35,24,.72);color:var(--cream);border:1px solid rgba(233,181,72,.3);padding:12px 22px;border-radius:999px;
              font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer}
  #nav button:disabled{opacity:.3}
  #note{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;
        font-size:1.05rem;line-height:1.8;color:var(--muted);display:none;z-index:5;padding:0 24px}
</style>
</head>
<body>
  <div id="bg-art"></div>
  <div id="bg"></div>
  <div id="hud">
    <a class="pill" id="homeBtn" href="index.html">‹ Home</a>
    <div id="langbar"></div>
    <button class="pill" id="soundBtn">🔊</button>
  </div>

  <div id="note"></div>

  <div id="info">
    <div id="title">Page</div>
    <div id="sub"></div>
    <div id="nav">
      <button id="prev">‹</button>
      <button id="next">›</button>
    </div>
  </div>

  <a-scene background="color:#14301f" renderer="colorManagement: true">
    <a-light type="ambient" intensity="1.3"></a-light>
    <a-light type="directional" position="2 4 4" intensity="1.6"></a-light>
    <a-light type="directional" position="-3 2 -2" intensity="0.6"></a-light>
    <a-entity id="turntable" animation="property: rotation; to: 0 360 0; loop: true; dur: 18000; easing: linear">
      <a-gltf-model id="model" position="0 0.24 0" scale="0.55 0.55 0.55"></a-gltf-model>
    </a-entity>
    <a-camera position="0 0.35 1.6"></a-camera>
  </a-scene>

  <audio id="narration" preload="auto" loop></audio>

  <script src="config.js?v=23"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const total = CONFIG.pages.length;
    let page = parseInt(params.get("page") || "1", 10);
    if (!(page >= 1 && page <= total)) page = 1;
    let lang = params.get("lang") || localStorage.getItem("lang") || "en";
    if (!CONFIG.languages.some(l => l.code === lang)) lang = CONFIG.languages[0].code;
    const T = CONFIG.ui[lang] || CONFIG.ui.en;

    const audio   = document.getElementById("narration");
    const modelEl = document.getElementById("model");
    const titleEl = document.getElementById("title");
    const noteEl  = document.getElementById("note");
    const prev    = document.getElementById("prev");
    const next    = document.getElementById("next");
    let muted = false;

    document.getElementById("homeBtn").textContent = "‹ " + T.home;
    document.getElementById("sub").textContent = T.viewerHint;
    prev.textContent = T.prev;
    next.textContent = T.next;

    const langbar = document.getElementById("langbar");
    CONFIG.languages.forEach(L => {
      const b = document.createElement("button");
      b.className = "pill" + (L.code === lang ? " on" : "");
      b.textContent = L.label;
      b.onclick = () => { localStorage.setItem("lang", L.code); location.href = "viewer.html?page=" + page + "&lang=" + L.code; };
      langbar.appendChild(b);
    });

    let mixer = null;
    const sceneEl = document.querySelector("a-scene");
    const clipIndex = (CONFIG.animClip === undefined) ? 0 : CONFIG.animClip;

    function startAnim() {
      if (clipIndex < 0) return;
      const obj = modelEl.getObject3D("mesh");
      if (!obj || !obj.animations || !obj.animations.length) return;
      if (mixer) { mixer.stopAllAction(); mixer.uncacheRoot(mixer.getRoot()); mixer = null; }
      mixer = new THREE.AnimationMixer(obj);
      mixer.clipAction(obj.animations[Math.min(clipIndex, obj.animations.length - 1)]).play();
    }
    sceneEl.addEventListener("tick", (e) => {
      if (mixer) mixer.update((e.detail.timeDelta || 16) / 1000);
    });

    modelEl.addEventListener("model-error", () => {
      noteEl.style.display = "block";
      noteEl.innerHTML = T.loadFail + "<br><button id='retry' class='pill' style='margin-top:12px'>" +
                         T.retry + "</button>";
      modelEl.setAttribute("visible", "false");
      const r = document.getElementById("retry");
      if (r) r.onclick = () => { noteEl.style.display = "none"; modelEl.setAttribute("src", ""); setTimeout(render, 60); };
    });
    modelEl.addEventListener("model-loaded", () => {
      noteEl.style.display = "none";
      modelEl.setAttribute("visible", "true");
      fitCamera();
      startAnim();
    });

    // 竖屏 / 横屏都自动把模型框进画面
    function fitCamera(){
      const obj = modelEl.getObject3D("mesh");
      const camEl = document.querySelector("a-camera");
      const cam3 = camEl.getObject3D("camera");
      if (!obj || !cam3) return;
      sceneEl.object3D.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(obj);
      if (box.isEmpty()) return;
      const ctr  = box.getCenter(new THREE.Vector3());
      const vfov = cam3.fov * Math.PI / 180;
      const hfov = 2 * Math.atan(Math.tan(vfov / 2) * cam3.aspect);
      const th = Math.tan(hfov / 2), tv = Math.tan(vfov / 2);
      let dist = 0;
      [box.min.x, box.max.x].forEach(x => {
        [box.min.y, box.max.y].forEach(y => {
          [box.min.z, box.max.z].forEach(z => {
            const need = Math.max(z + Math.abs(x) / th, z + Math.abs(y - ctr.y) / tv);
            if (need > dist) dist = need;
          });
        });
      });
      camEl.setAttribute("position", { x: 0, y: ctr.y, z: dist * 1.1 });
    }
    window.addEventListener("resize", () => setTimeout(fitCamera, 200));
    window.addEventListener("orientationchange", () => setTimeout(fitCamera, 300));

    let slowTimer = null;
    function render() {
      const p = CONFIG.pages[page - 1];
      titleEl.textContent = T.pageWord + " " + page + " / " + total;
      noteEl.style.display = "block";
      noteEl.innerHTML = T.loading;
      modelEl.setAttribute("visible", "true");
      modelEl.setAttribute("src", p.model);

      if (slowTimer) clearTimeout(slowTimer);
      slowTimer = setTimeout(() => {
        if (noteEl.style.display !== "none") {
          noteEl.innerHTML = T.loading + "<br><span style='font-size:.85rem;color:var(--muted)'>" + T.loadingSlow + "</span>";
        }
      }, 6000);

      if (p.audio[lang]) {
        audio.src = p.audio[lang];
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
      prev.disabled = page === 1;
      next.disabled = page === total;
    }

    prev.onclick = () => { if (page > 1) { page--; render(); } };
    next.onclick = () => { if (page < total) { page++; render(); } };

    document.getElementById("soundBtn").onclick = () => {
      muted = !muted;
      audio.muted = muted;
      document.getElementById("soundBtn").textContent = muted ? "🔇" : "🔊";
    };

    render();
  </script>
</body>
</html>
