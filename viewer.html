<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Sungai Tanaki · 3D</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<style>
  :root{--gold:#e9b548;--gold2:#f6cf76;--orange:#ee9a35;--orange2:#e5842a;--cream:#f4ecdc;--muted:#a9c0a4;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:var(--cream);font-size:18px;
            overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
  #bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 26%,rgba(28,58,40,.9),rgba(14,35,24,.95) 70%);z-index:-1}
  #bg-art{position:fixed;inset:-12%;z-index:-2;background:url('assets/pages/cover.jpg') center/cover no-repeat;
          filter:blur(30px) saturate(1.15);opacity:.22;transform:scale(1.12)}
  #hud{position:fixed;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between;
       align-items:center;z-index:5;gap:8px}
  .pill{color:var(--cream);background:rgba(14,35,24,.72);padding:11px 16px;border-radius:999px;font-size:1rem;
        font-weight:600;text-decoration:none;border:1px solid rgba(233,181,72,.3);font-family:inherit;cursor:pointer;
        backdrop-filter:blur(6px)}
  #langbar{display:flex;gap:6px}
  #langbar button{opacity:.65;min-width:56px;padding:9px 12px}
  #langbar button.on{opacity:1;background:linear-gradient(135deg,var(--gold),var(--orange2));color:#2a1a05;font-weight:800;border-color:transparent}
  #info{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;text-align:center;
        width:100%;padding:0 16px}
  #title{font-family:Georgia,serif;font-size:1.45rem;font-weight:800;margin-bottom:4px;color:var(--cream)}
  #sub{font-size:.95rem;color:var(--muted)}
  #nav{display:flex;gap:10px;justify-content:center;margin-top:12px}
  #nav button{background:rgba(14,35,24,.72);color:var(--cream);border:1px solid rgba(233,181,72,.3);padding:12px 22px;border-radius:999px;
              font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer}
  #nav button:disabled{opacity:.3}
  #note{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;
        font-size:1.05rem;line-height:1.8;color:var(--muted);display:none;z-index:5;padding:0 24px}
  a-scene{z-index:0}
  .a-canvas{touch-action:none!important}
  @media (max-width:430px){
    #hud{padding:12px 10px;gap:6px}
    .pill{padding:10px 13px;font-size:.95rem}
    #langbar{gap:4px}
    #langbar button{min-width:42px;padding:9px 8px}
    #viewReset{padding:10px 12px}
  }
</style>
</head>
<body>
  <div id="bg-art"></div>
  <div id="bg"></div>
  <div id="hud">
    <a class="pill" id="homeBtn" href="index.html">‹ Home</a>
    <div id="langbar"></div>
    <button class="pill" id="viewReset" aria-label="reset view" title="Reset view">⟲</button>
    <button class="pill" id="soundBtn">🔊</button>
  </div>

  <div id="note"></div>

  <div id="info">
    <div id="title">Page</div>
    <div id="sub"></div>
    <div id="nav">
      <button id="prev">‹</button>
      <button id="next">›</button>
    </div>
  </div>

  <a-scene id="scene" background="color:#14301f" renderer="colorManagement: true" vr-mode-ui="enabled: false">
    <a-light type="ambient" intensity="1.3"></a-light>
    <a-light type="directional" position="2 4 4" intensity="1.6"></a-light>
    <a-light type="directional" position="-3 2 -2" intensity="0.6"></a-light>
    <a-entity id="turntable">
      <a-gltf-model id="model" position="0 0.24 0" scale="0.55 0.55 0.55"></a-gltf-model>
    </a-entity>
    <a-camera id="cam" position="0 0.6 5" fov="50"
              look-controls="enabled: false; magicWindowTrackingEnabled: false; touchEnabled: false; mouseEnabled: false"
              wasd-controls-enabled="false"></a-camera>
  </a-scene>

  <audio id="narration" preload="auto" loop></audio>

  <script src="config.js?v=28"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const total = CONFIG.pages.length;
    let page = parseInt(params.get("page") || "1", 10);
    if (!(page >= 1 && page <= total)) page = 1;
    let lang = params.get("lang") || localStorage.getItem("lang") || "en";
    if (!CONFIG.languages.some(l => l.code === lang)) lang = CONFIG.languages[0].code;
    const T = CONFIG.ui[lang] || CONFIG.ui.en;

    const audio   = document.getElementById("narration");
    const modelEl = document.getElementById("model");
    const titleEl = document.getElementById("title");
    const noteEl  = document.getElementById("note");
    const prev    = document.getElementById("prev");
    const next    = document.getElementById("next");
    let muted = false;

    document.getElementById("homeBtn").textContent = "‹ " + T.home;
    document.getElementById("sub").textContent = T.viewerHint;
    prev.textContent = T.prev;
    next.textContent = T.next;

    const langbar = document.getElementById("langbar");
    CONFIG.languages.forEach(L => {
      const b = document.createElement("button");
      b.className = "pill" + (L.code === lang ? " on" : "");
      b.textContent = L.label;
      b.onclick = () => { localStorage.setItem("lang", L.code); location.href = "viewer.html?page=" + page + "&lang=" + L.code; };
      langbar.appendChild(b);
    });

    let mixer = null;
    const sceneEl = document.querySelector("a-scene");
    const clipIndex = (CONFIG.animClip === undefined) ? 0 : CONFIG.animClip;

    function startAnim() {
      if (clipIndex < 0) return;
      const obj = modelEl.getObject3D("mesh");
      if (!obj || !obj.animations || !obj.animations.length) return;
      if (mixer) { mixer.stopAllAction(); mixer.uncacheRoot(mixer.getRoot()); mixer = null; }
      mixer = new THREE.AnimationMixer(obj);
      mixer.clipAction(obj.animations[Math.min(clipIndex, obj.animations.length - 1)]).play();
    }

    /* ---------------- 镜头：固定机位 + 绕模型 orbit + 捏合缩放 ---------------- */
    const camEl    = document.getElementById("cam");
    const turntable = document.getElementById("turntable");
    const orbit = { tx: 0, ty: 0.4, tz: 0, dist: 3.5, min: 1.2, max: 14, az: 0, el: 18 };
    let camReady = false, userZoom = false;
    let baseDist = 3.5;            // 每页适配后的“原始镜头”距离
    const HOME_EL = 18;            // 原始镜头俯角
    let returning = false;         // 是否正在回到原始镜头

    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    function applyCam() {
      const az = orbit.az * Math.PI / 180, el = orbit.el * Math.PI / 180;
      camEl.setAttribute("position", {
        x: orbit.tx + orbit.dist * Math.sin(az) * Math.cos(el),
        y: orbit.ty + orbit.dist * Math.sin(el),
        z: orbit.tz + orbit.dist * Math.cos(az) * Math.cos(el)
      });
      camEl.setAttribute("rotation", { x: -orbit.el, y: orbit.az, z: 0 });
    }

    // 按包围盒的宽/高分别算所需距离，取更远的那个（横幅场景不会被缩得太小）
    function fitCamera() {
      const obj = modelEl.getObject3D("mesh");
      const cam3 = camEl.getObject3D("camera") || sceneEl.camera;
      if (!obj || !cam3) return;
      sceneEl.object3D.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(obj);
      if (box.isEmpty()) return;
      const ctr = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      // 手机竖屏时 innerHeight 可能还没稳定，用画布实际尺寸兜底
      const cvs = sceneEl.canvas;
      const vw = (cvs && cvs.clientWidth) || window.innerWidth;
      const vh = (cvs && cvs.clientHeight) || window.innerHeight;
      const aspect = vw / vh;

      const halfW = size.x / 2, halfH = size.y / 2, halfD = size.z / 2;
      orbit.tx = ctr.x; orbit.ty = ctr.y - halfH * 0.08; orbit.tz = ctr.z;

      const vfov = ((cam3.fov || 50) * Math.PI) / 180;
      const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
      const dW = halfW / Math.tan(hfov / 2);
      const dH = halfH / Math.tan(vfov / 2);
      let final = (Math.max(dW, dH) + halfD * 0.9) * 1.16;
      if (!isFinite(final) || final <= 0) final = 4;
      final = clamp(final, 0.6, 40);

      baseDist = final;
      orbit.min = final * 0.35;
      orbit.max = final * 2.6;
      if (!userZoom) { orbit.dist = final; orbit.az = 0; orbit.el = HOME_EL; }
      camReady = true;
      applyCam();
    }

    // 返回原始镜头（5 秒静置自动触发，也可点 ⟲）
    function goHome() { returning = true; userZoom = false; }

    function stepHome(dt) {
      let dAz = -orbit.az;
      dAz = ((dAz + 180) % 360 + 360) % 360 - 180;   // 走最短方向
      const k = 1 - Math.exp(-dt / 0.30);
      orbit.az += dAz * k;
      orbit.el += (HOME_EL - orbit.el) * k;
      orbit.dist += (baseDist - orbit.dist) * k;
      if (Math.abs(dAz) < 0.6 && Math.abs(orbit.el - HOME_EL) < 0.6 &&
          Math.abs(orbit.dist - baseDist) < 0.03) {
        orbit.az = 0; orbit.el = HOME_EL; orbit.dist = baseDist;
        returning = false;
      }
      applyCam();
    }

    // 把半透明材质收紧一点：避免叶片/烟雾互相“透视”，看起来像模型透明
    function solidify(obj) {
      obj.traverse(n => {
        if (!n.isMesh) return;
        const mats = Array.isArray(n.material) ? n.material : [n.material];
        mats.forEach(m => {
          if (!m) return;
          m.side = THREE.DoubleSide;
          if (m.transparent) {
            m.alphaTest = 0.12;
            m.depthWrite = true;
            m.needsUpdate = true;
          }
        });
      });
    }

    /* ---------------- 手势 ---------------- */
    const IDLE_MS = 5000;
    let autoRot = true, lastInteract = performance.now();
    const pointers = new Map();
    let pinchPrev = 0;

    function markInteract() { lastInteract = performance.now(); autoRot = false; returning = false; }

    // 命中 UI 时不接管手势
    function onUI(e) {
      const t = e.target;
      if (!t || !t.closest) return false;
      return !!t.closest("#hud, #info, #nav, #note, .pill, button");
    }
    function pinchDist() {
      const v = [...pointers.values()];
      if (v.length < 2) return 0;
      return Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
    }

    function onDown(e) {
      if (onUI(e)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      markInteract();
      if (pointers.size === 2) pinchPrev = pinchDist();
      if (e.cancelable) e.preventDefault();
    }
    function onMove(e) {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      markInteract();

      if (pointers.size >= 2) {
        const d = pinchDist();
        if (pinchPrev > 0 && d > 0 && Math.abs(d - pinchPrev) > 0.5) {
          orbit.dist = clamp(orbit.dist * (pinchPrev / d), orbit.min, orbit.max);
          pinchPrev = d;
          userZoom = true;
          if (camReady) applyCam();
        }
      } else {
        orbit.az += dx * 0.35;
        orbit.el = clamp(orbit.el + dy * 0.35, -6, 70);
        if (camReady) applyCam();
      }
      if (e.cancelable) e.preventDefault();
    }
    function onUp(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchPrev = 0;
      lastInteract = performance.now();
    }

    document.addEventListener("pointerdown", onDown, { passive: false });
    document.addEventListener("pointermove", onMove, { passive: false });
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
    document.addEventListener("wheel", (e) => {
      if (onUI(e)) return;
      e.preventDefault();
      markInteract();
      orbit.dist = clamp(orbit.dist * (1 + e.deltaY * 0.0015), orbit.min, orbit.max);
      userZoom = true;
      if (camReady) applyCam();
    }, { passive: false });

    /* ---------------- 每帧：动画 + 自转 ---------------- */
    const DBG = params.get("debug") === "1";
    let dbgLast = 0;
    let lastTick = performance.now();
    function animLoop(now) {
      const dt = Math.min((now - lastTick) / 1000, 0.12);
      lastTick = now;
      if (mixer) mixer.update(dt);

      // 静置 5 秒：恢复自转，并缓缓回到原始镜头
      if (!autoRot && now - lastInteract > IDLE_MS) { autoRot = true; goHome(); }
      if (autoRot) {
        if (returning) stepHome(dt);
        turntable.object3D.rotation.y += 0.35 * dt;
      }

      if (DBG && now - dbgLast > 250) {
        dbgLast = now;
        document.body.setAttribute("data-dbg",
          "rotY=" + turntable.object3D.rotation.y.toFixed(3) +
          " az=" + orbit.az.toFixed(1) + " el=" + orbit.el.toFixed(1) +
          " dist=" + orbit.dist.toFixed(2) + " auto=" + (autoRot ? 1 : 0) +
          " zoom=" + (userZoom ? 1 : 0));
      }
      requestAnimationFrame(animLoop);
    }
    requestAnimationFrame(animLoop);

    modelEl.addEventListener("model-error", () => {
      noteEl.style.display = "block";
      noteEl.innerHTML = T.loadFail + "<br><button id='retry' class='pill' style='margin-top:12px'>" +
                         T.retry + "</button>";
      modelEl.setAttribute("visible", "false");
      const r = document.getElementById("retry");
      if (r) r.onclick = () => { noteEl.style.display = "none"; modelEl.setAttribute("src", ""); setTimeout(render, 60); };
    });
    modelEl.addEventListener("model-loaded", () => {
      noteEl.style.display = "none";
      modelEl.setAttribute("visible", "true");
      const obj = modelEl.getObject3D("mesh");
      if (obj && params.get("solid") !== "0") solidify(obj);
      fitCamera();
      startAnim();
      // 手机竖屏尺寸可能延迟才稳定，多算几次
      [60, 400, 1200].forEach(t => setTimeout(fitCamera, t));
    });

    window.addEventListener("resize", () => setTimeout(fitCamera, 200));
    window.addEventListener("orientationchange", () => setTimeout(() => { userZoom = false; fitCamera(); }, 300));

    let slowTimer = null;
    function render() {
      const p = CONFIG.pages[page - 1];
      titleEl.textContent = T.pageWord + " " + page + " / " + total;
      noteEl.style.display = "block";
      noteEl.innerHTML = T.loading;
      modelEl.setAttribute("visible", "true");
      modelEl.setAttribute("src", new URLSearchParams(location.search).get("model") || p.model);
      camReady = false; userZoom = false;
      turntable.object3D.rotation.y = 0;

      if (slowTimer) clearTimeout(slowTimer);
      slowTimer = setTimeout(() => {
        if (noteEl.style.display !== "none") {
          noteEl.innerHTML = T.loading + "<br><span style='font-size:.85rem;color:var(--muted)'>" + T.loadingSlow + "</span>";
        }
      }, 6000);

      if (p.audio[lang]) {
        audio.src = p.audio[lang];
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
      prev.disabled = page === 1;
      next.disabled = page === total;
    }

    prev.onclick = () => { if (page > 1) { page--; render(); } };
    next.onclick = () => { if (page < total) { page++; render(); } };

    document.getElementById("soundBtn").onclick = () => {
      muted = !muted;
      audio.muted = muted;
      document.getElementById("soundBtn").textContent = muted ? "🔇" : "🔊";
    };

    document.getElementById("viewReset").onclick = () => {
      lastInteract = performance.now();
      autoRot = true;
      turntable.object3D.rotation.y = 0;
      goHome();
    };

    render();
  </script>
</body>
</html>
