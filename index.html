<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="title">Sungai Tanaki · AR</title>
<style>
  :root{
    --bg:#0e2318; --bg2:#15301f; --card:#1c3a28; --card2:#224630;
    --line:#33593d; --gold:#e9b548; --gold2:#f6cf76; --cream:#f4ecdc;
    --muted:#a9c0a4; --orange:#ee9a35; --orange2:#e5842a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:17px;scroll-behavior:smooth}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--cream);
       line-height:1.6;font-size:1rem;overflow-x:hidden}

  /* 封面插画做模糊氛围背景 + 深绿纱罩 */
  #bg-art{position:fixed;inset:-12%;z-index:-2;background:url('assets/pages/cover.jpg') center/cover no-repeat;
          filter:blur(30px) saturate(1.15);opacity:.30;transform:scale(1.12)}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 500px at 78% 12%, rgba(233,181,72,.10), transparent 60%),
      radial-gradient(700px 500px at 10% 85%, rgba(46,110,74,.35), transparent 60%),
      linear-gradient(180deg, rgba(14,35,24,.88), rgba(21,48,31,.92))}

  /* 漂浮金尘 */
  #sparkles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .spark{position:absolute;bottom:-6px;border-radius:50%;background:var(--gold);
         box-shadow:0 0 6px rgba(233,181,72,.8);animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-105vh);opacity:0}}

  /* ---------- top nav (sticky) ---------- */
  .nav-bar{position:sticky;top:0;z-index:50;background:rgba(14,35,24,.9);backdrop-filter:blur(12px);
           -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;
       justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-weight:800;letter-spacing:.02em;
         color:var(--cream);text-decoration:none;font-size:1.15rem}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--orange2));
         display:flex;align-items:center;justify-content:center;color:#2a1a05;font-size:1rem}
  .nav-links{display:flex;gap:22px;color:var(--cream);font-size:.95rem}
  .nav-links a{color:inherit;text-decoration:none;transition:color .2s}
  .nav-links a:hover{color:var(--gold2)}
  .nav-right{display:flex;gap:10px;align-items:center}
  .mini-lang{display:flex;background:rgba(255,255,255,.07);border-radius:999px;padding:3px}
  .mini-lang button{background:transparent;border:0;color:var(--muted);font-weight:700;
        padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:.9rem;transition:all .2s}
  .mini-lang button.on{background:var(--cream);color:#2a1a05}
  .nav-cta{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border:0;border-radius:999px;padding:9px 18px;
        font-weight:800;cursor:pointer;font-family:inherit;font-size:.92rem;text-decoration:none;
        transition:transform .2s,box-shadow .2s}
  .nav-cta:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(229,132,42,.35)}

  .wrap{max-width:1080px;margin:0 auto;padding:10px 20px 56px;position:relative;z-index:1}

  /* ---------- hero ---------- */
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center;padding:26px 0 20px}
  .badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(233,181,72,.45);
         color:var(--gold2);padding:8px 16px;border-radius:999px;font-size:.8rem;
         letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:clamp(38px,7vw,64px);
     line-height:1.05;letter-spacing:.01em;margin-bottom:14px}
  h1 .accent{color:var(--gold);font-style:italic;display:block}
  .sub{color:var(--muted);font-size:1.05rem;max-width:560px}

  .actions{margin-top:26px;display:flex;gap:14px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:14px;
       text-decoration:none;font-weight:700;border:0;cursor:pointer;font-size:1.02rem;font-family:inherit;
       transition:transform .2s,box-shadow .2s,background .2s}
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--orange2));color:#2a1a05;
       box-shadow:0 12px 28px rgba(229,132,42,.32)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(229,132,42,.45)}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--cream);border:1px solid rgba(255,255,255,.18)}
  .btn-ghost:hover{transform:translateY(-3px);background:rgba(255,255,255,.1)}

  /* 装饰性硬壳书样机（纯展示，不可点击跳转） */
  .book{position:relative;justify-self:center;width:min(262px,70vw);aspect-ratio:3/4;
        transform-style:preserve-3d;transition:transform .25s ease;
        transform:perspective(1000px) rotateY(36deg) rotateX(4deg) rotateZ(3deg);
        animation:bookIn .7s ease .12s both}
  .book.front-facing{transform:perspective(1000px) rotateY(0) rotateX(0) rotateZ(0)}
  @keyframes bookIn{from{opacity:0}to{opacity:1}}
  .book::before{content:"";position:absolute;inset:-10% -18%;z-index:-2;
        background:radial-gradient(ellipse at 50% 40%,rgba(244,236,220,.10),transparent 70%)}
  .book::after{content:"";position:absolute;left:0;right:-6%;bottom:-20px;height:30px;z-index:-1;
        background:radial-gradient(ellipse at 60% 50%,rgba(0,0,0,.6),transparent 70%);filter:blur(10px)}
  .book-pages{position:absolute;right:-14px;top:10px;bottom:10px;width:14px;border-radius:0 3px 3px 0;z-index:0;
        background:repeating-linear-gradient(90deg,#f6f1e3 0 2px,#d8cfb4 2px 3px);
        box-shadow:2px 3px 8px rgba(0,0,0,.35)}
  .book-spine{position:absolute;left:0;top:0;bottom:0;width:20px;border-radius:6px 0 0 6px;z-index:1;
        background:linear-gradient(90deg,#0c2115,#1d422d 55%,#35623f);
        box-shadow:inset -3px 0 6px rgba(0,0,0,.5),inset 2px 0 3px rgba(233,181,72,.2);
        border-left:1px solid rgba(246,207,118,.35);
        display:flex;align-items:center;justify-content:center;overflow:hidden}
  .spine-title{writing-mode:vertical-rl;color:var(--gold2);font-size:.62rem;font-weight:700;
        letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
  .book-front{position:absolute;left:19px;right:0;top:0;bottom:0;z-index:2;border-radius:4px 14px 14px 4px;overflow:hidden;
        border:1px solid rgba(255,255,255,.22);
        box-shadow:0 24px 50px rgba(0,0,0,.5);animation:floaty 6s ease-in-out infinite;
        perspective:1200px;touch-action:manipulation}
  .book:hover .book-front{box-shadow:0 36px 80px rgba(0,0,0,.6),0 0 0 1px rgba(233,181,72,.4)}
  .page-layer{position:absolute;inset:0}
  .page-layer img{width:100%;height:100%;object-fit:cover;display:block}
  #pageBack{z-index:1}
  #pageLeaf{z-index:2;transform-origin:left center;backface-visibility:hidden;visibility:hidden}
  #pageLeaf.turn-next{visibility:visible;animation:turnNext .55s cubic-bezier(.3,.7,.4,1) forwards}
  #pageLeaf.turn-prev{visibility:visible;animation:turnPrev .55s cubic-bezier(.3,.7,.4,1) forwards}
  @keyframes turnNext{0%{transform:rotateY(0)}100%{transform:rotateY(-172deg)}}
  @keyframes turnPrev{0%{transform:rotateY(-172deg)}100%{transform:rotateY(0)}}
  #pageLeaf::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
        background:linear-gradient(90deg,rgba(20,12,4,.45),rgba(20,12,4,0) 55%)}
  #pageLeaf.turn-next::after,#pageLeaf.turn-prev::after{animation:leafShade .55s ease}
  @keyframes leafShade{0%{opacity:0}45%{opacity:.7}100%{opacity:0}}
  .pg-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:30px;height:30px;border-radius:50%;
        background:rgba(12,33,21,.72);color:var(--gold2);border:1px solid rgba(233,181,72,.45);
        font-size:1.15rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .pg-btn.prev{left:6px}.pg-btn.next{right:6px}
  .pg-btn:disabled{opacity:.28;cursor:default}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .stats{display:flex;gap:34px;justify-content:center;margin-top:34px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
  .stats b{display:block;color:var(--cream);font-size:1.7rem;font-family:Georgia,serif}

  h2{font-family:Georgia,serif;font-size:clamp(23px,5.5vw,30px);color:var(--cream);margin:48px 0 6px}
  .lead{color:var(--muted);font-size:1rem;margin-bottom:14px}

  /* ---------- about the story ---------- */
  .about-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:32px;margin-top:46px;align-items:start}
  .kicker{display:inline-block;color:var(--orange);letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;font-weight:800;margin-bottom:12px}
  .about-head{margin:0 0 18px;line-height:1.15}
  .chars{display:flex;gap:12px;flex-wrap:wrap}
  .char{flex:1 1 150px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
        transition:transform .25s,border-color .25s}
  .char:hover{transform:translateY(-5px);border-color:rgba(233,181,72,.4)}
  .char b{font-family:Georgia,serif;font-size:1.15rem;display:block;margin-bottom:5px;color:var(--cream)}
  .char p{color:var(--muted);font-size:.92rem;line-height:1.5}
  .about-text p{margin-bottom:15px;color:var(--cream)}
  .about-text .drop::first-letter{font-family:Georgia,serif;font-weight:800;font-size:2.7em;float:left;line-height:.82;
        color:var(--gold);padding:4px 10px 0 0}

  /* 锚点定位偏移（避开吸顶导航） */
  #about,#steps,#langs,#grid,#faq{scroll-margin-top:76px}

  /* ---------- FAQ ---------- */
  .faq{display:flex;flex-direction:column;gap:10px;margin-top:14px;max-width:760px}
  .faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px;
        transition:border-color .25s}
  .faq details[open]{border-color:rgba(233,181,72,.4)}
  .faq summary{cursor:pointer;font-weight:700;padding:15px 4px;list-style:none;display:flex;
        justify-content:space-between;align-items:center;gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+";color:var(--gold);font-size:1.3rem;font-weight:800;flex:none}
  .faq details[open] summary::after{content:"–"}
  .faq details p{color:var(--muted);padding:0 4px 15px;font-size:.96rem}

  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
        transition:transform .25s,border-color .25s}
  .step:hover{transform:translateY(-5px);border-color:rgba(233,181,72,.4)}
  .step .n{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#2a1a05;
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;margin-bottom:10px}
  .step b{font-size:1.05rem}
  .step p{color:var(--muted);margin-top:6px;font-size:.98rem}

  .lang-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;
        max-width:960px;margin-left:auto;margin-right:auto}
  @media(max-width:720px){.lang-cards{grid-template-columns:1fr}}
  .lang-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
        display:flex;flex-direction:column;align-items:flex-start;gap:12px}
  .lang-card .badge{min-width:46px;height:44px;padding:0 12px;border-radius:12px;display:grid;place-items:center;
        font-weight:800;font-size:.85rem;letter-spacing:.04em;white-space:nowrap;color:#2a1a05;flex:none;margin:0}
  .lang-card[data-code="en"] .badge{background:var(--gold)}
  .lang-card[data-code="bm"] .badge{background:var(--orange)}
  .lang-card[data-code="dsn"] .badge{background:#9a6a33;color:var(--cream)}
  .lang-card h3{font-family:Georgia,serif;font-size:1.15rem;color:var(--cream)}
  .lang-card .desc{color:var(--muted);font-size:.92rem;line-height:1.5;flex:1}
  .sample-row{display:flex;align-items:center;gap:10px;width:100%}
  .sample-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
        background:rgba(255,255,255,.08);color:var(--cream);display:grid;place-items:center;
        cursor:pointer;flex:none;padding:0}
  .sample-btn svg{width:18px;height:18px}
  .sample-row .lbl{color:var(--muted);font-size:.9rem}
  .card-actions{display:flex;gap:10px;width:100%}
  .card-actions a{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:700;
        font-size:.9rem;text-decoration:none}
  .card-actions .ar{background:var(--orange);color:#2a1a05}
  .card-actions .v3d{background:transparent;border:1px solid var(--line);color:var(--cream)}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;
        max-width:720px;margin-left:auto;margin-right:auto}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
        text-decoration:none;color:var(--cream);display:block;aspect-ratio:3/4;position:relative;
        transition:transform .25s,box-shadow .25s}
  .cell:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(0,0,0,.4)}
  .cell .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:1.8rem;font-weight:700;color:#4f7458}
  .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
  .cell:hover img{transform:scale(1.07)}
  .cell span{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(0,0,0,.68);padding:4px 5px;
             border-radius:999px;font-size:.74rem;font-weight:600;text-align:center;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  footer{margin-top:52px;color:var(--muted);font-size:.9rem;text-align:center;line-height:1.7}

  /* 入场 / 滚动显现 */
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .hero .badge,.hero h1,.hero .sub,.hero .actions,.hero .stats{animation:fadeUp .7s ease both}
  .hero h1{animation-delay:.08s}.hero .sub{animation-delay:.16s}.hero .actions{animation-delay:.24s}
  .hero .stats{animation-delay:.32s}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
  .reveal.on{opacity:1;transform:none}

  @media (max-width:760px){
    html{font-size:18px}
    .nav-links{display:none}
    .hero{grid-template-columns:1fr;gap:22px;text-align:center}
    .book{order:-1;width:min(240px,70vw)}
    .badge{margin:0 auto 16px}
    .sub{margin:0 auto}
    .actions{justify-content:center;flex-direction:column;align-items:stretch}
    .btn{justify-content:center}
    .steps{grid-template-columns:1fr}
    .about-grid{grid-template-columns:1fr;gap:22px}
    .grid{gap:8px}
  }
</style>
</head>
<body>

<div id="bg-art"></div>
<div id="sparkles"></div>

<header class="nav-bar">
<nav class="nav">
  <a class="brand" href="index.html"><span class="mark">✦</span> Sungai Tanaki</a>
  <div class="nav-links">
    <a href="#about" data-i18n="aboutNav">Story</a>
    <a href="#steps" data-i18n="navHelp">How it works</a>
    <a href="#langs" data-i18n="navLangs">Language</a>
    <a href="#grid" data-i18n="navPages">Page</a>
    <a href="#faq" data-i18n="navFaq">FAQ</a>
  </div>
  <div class="nav-right">
    <div class="mini-lang" id="miniLang"></div>
    <a class="nav-cta" href="ar.html" data-i18n="start">Imbas AR</a>
  </div>
</nav>
</header>

<div class="wrap">
  <div class="hero">
    <div>
      <span class="badge" data-i18n="badge">Augmented Reality Storybook</span>
      <h1><span id="bookTitle">Sungai Tanaki</span><span class="accent" id="bookAccent">AR</span></h1>
      <p class="sub" id="bookSub" data-i18n="sub"></p>
      <div class="actions">
        <a class="btn btn-primary" id="startBtn" href="ar.html" data-i18n="start">Start scanning</a>
        <a class="btn btn-ghost" id="viewBtn" href="viewer.html?page=1" data-i18n="view">No book? View in 3D</a>
      </div>
      <div class="stats">
        <div><b id="statPages">0</b> <span data-i18n="statPages">story pages</span></div>
        <div><b id="statLive">0</b> <span data-i18n="statLive">AR pages live</span></div>
        <div><b id="statLangs">0</b> <span data-i18n="statLangs">narration languages</span></div>
      </div>
    </div>
    <div class="book" id="coverCard" aria-label="Sungai Tanaki book cover">
      <div class="book-pages"></div>
      <div class="book-spine"><span class="spine-title">Sungai Tanaki</span></div>
      <div class="book-front" id="bookFront">
        <div class="page-layer" id="pageBack"><img id="backImg" src="assets/pages/cover.jpg" alt="Sungai Tanaki page" onerror="this.src='assets/pages/page1.jpg'"/></div>
        <div class="page-layer" id="pageLeaf"><img id="leafImg" alt="Sungai Tanaki page"/></div>
        <button class="pg-btn prev" id="pgPrev" aria-label="Previous page">‹</button>
        <button class="pg-btn next" id="pgNext" aria-label="Next page">›</button>
      </div>
    </div>
  </div>

  <section id="about" class="reveal">
    <div class="about-grid">
      <div class="about-left">
        <span class="kicker" data-i18n="aboutKicker"></span>
        <h2 class="about-head" data-i18n="aboutHeadline"></h2>
        <div class="chars" id="charRow"></div>
      </div>
      <div class="about-text">
        <p class="drop" data-i18n="aboutP1"></p>
        <p data-i18n="aboutP2"></p>
      </div>
    </div>
  </section>

  <h2 id="langs" class="reveal" data-i18n="listenTitle"></h2>
  <p class="lead reveal" data-i18n="listenSub"></p>
  <div class="lang-cards reveal" id="langRow"></div>

  <h2 id="steps" class="reveal" data-i18n="howTitle">How it works</h2>
  <div class="steps reveal">
    <div class="step"><div class="n">1</div><b data-i18n="s1t"></b><p data-i18n="s1b"></p></div>
    <div class="step"><div class="n">2</div><b data-i18n="s2t"></b><p data-i18n="s2b"></p></div>
    <div class="step"><div class="n">3</div><b data-i18n="s3t"></b><p data-i18n="s3b"></p></div>
  </div>

  <h2 id="grid" class="reveal" data-i18n="gridTitle">Every page, a small world</h2>
  <p class="lead reveal" data-i18n="gridSub"></p>
  <div class="grid reveal" id="pageGrid"></div>

  <h2 id="faq" class="reveal" data-i18n="faqTitle">Frequently asked questions</h2>
  <div class="faq reveal" id="faqList"></div>

  <footer class="reveal" data-i18n="footer"></footer>
</div>

<audio id="sampleAudio" preload="none"></audio>
<script src="config.js?v=34"></script>
<script>
  const params = new URLSearchParams(location.search);
  const HOME_CODES = ["en", "bm"];
  let lang = params.get("lang") || localStorage.getItem("lang") || "en";
  if (!HOME_CODES.includes(lang)) lang = "en";
  const T = CONFIG.ui[lang] || CONFIG.ui.en;
  const HOME_LANGS = CONFIG.languages.filter(l => HOME_CODES.includes(l.code));

  document.documentElement.lang = lang;
  document.title = CONFIG.bookTitle + " · AR";

  const titleParts = CONFIG.bookTitle.split(" ");
  document.getElementById("bookTitle").textContent = titleParts.slice(0, -1).join(" ") || CONFIG.bookTitle;
  document.getElementById("bookAccent").textContent = titleParts[titleParts.length - 1];

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = T[el.dataset.i18n];
    if (v) el.textContent = v;
  });

  document.getElementById("statPages").textContent = CONFIG.pages.length;
  document.getElementById("statLive").textContent = CONFIG.targetMap.length;
  document.getElementById("statLangs").textContent = CONFIG.languages.length;

  // 三语试听卡片（样片统一用 page 1；只试听，不切换页面语言）
  const sampleAudio = document.getElementById("sampleAudio");
  let sampleBtn = null;
  function syncSampleIcon(btn, playing) {
    btn.querySelector(".ic-play").style.display = playing ? "none" : "";
    btn.querySelector(".ic-pause").style.display = playing ? "" : "none";
  }
  function resetSample() {
    sampleAudio.pause(); sampleAudio.currentTime = 0;
    if (sampleBtn) { syncSampleIcon(sampleBtn, false); sampleBtn = null; }
  }
  const row = document.getElementById("langRow");
  CONFIG.languages.forEach(L => {
    const card = document.createElement("div");
    card.className = "lang-card";
    card.dataset.code = L.code;
    card.innerHTML =
      `<div class="badge">${L.label}</div>
       <h3>${L.name}</h3>
       <p class="desc">${L.desc}</p>
       <div class="sample-row">
         <button class="sample-btn" aria-label="${T.hearSample}">
           <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.86l10.4-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg>
           <svg class="ic-pause" style="display:none" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
         </button>
         <span class="lbl">${T.hearSample}</span>
       </div>
       <div class="card-actions">
         <a class="ar" href="ar.html?lang=${L.code}">AR</a>
         <a class="v3d" href="viewer.html?page=1&lang=${L.code}">3D</a>
       </div>`;
    const btn = card.querySelector(".sample-btn");
    btn.onclick = () => {
      if (sampleBtn === btn && !sampleAudio.paused) { resetSample(); return; }
      resetSample();
      sampleAudio.src = CONFIG.pages[0].audio[L.code];
      sampleAudio.play().catch(() => {});
      sampleBtn = btn; syncSampleIcon(btn, true);
    };
    row.appendChild(card);
  });
  sampleAudio.addEventListener("ended", resetSample);

  // 顶栏迷你语言切换
  const mini = document.getElementById("miniLang");
  HOME_LANGS.forEach(L => {
    const b = document.createElement("button");
    b.className = L.code === lang ? "on" : "";
    b.textContent = L.label;
    b.onclick = () => { localStorage.setItem("lang", L.code); location.href = "index.html?lang=" + L.code; };
    mini.appendChild(b);
  });

  document.getElementById("startBtn").href = "ar.html?lang=" + lang;
  document.getElementById("viewBtn").href =
    "viewer.html?page=" + (CONFIG.targetMap[0] || 1) + "&lang=" + lang;

  // 角色卡（About the Story）
  const charRow = document.getElementById("charRow");
  (T.aboutChars || []).forEach(c => {
    const d = document.createElement("div");
    d.className = "char";
    d.innerHTML = `<b>${c.name}</b><p>${c.role}</p>`;
    charRow.appendChild(d);
  });

  // FAQ 手风琴
  const faqList = document.getElementById("faqList");
  (T.faqItems || []).forEach(f => {
    const d = document.createElement("details");
    d.innerHTML = `<summary>${f.q}</summary><p>${f.a}</p>`;
    faqList.appendChild(d);
  });

  const grid = document.getElementById("pageGrid");
  const live = CONFIG.targetMap;
  CONFIG.pages.forEach((p, i) => {
    const num = i + 1;
    const a = document.createElement("a");
    a.className = "cell";
    a.href = "viewer.html?page=" + num + "&lang=" + lang;
    const label = T.pageWord + " " + num;
    a.innerHTML = `<div class="ph">${num}</div>
        <img src="${p.thumb}" alt="${label}" onerror="this.remove()"/>
        <span>${live.includes(num) ? "📷 " : ""}${label}</span>`;
    grid.appendChild(a);
  });

  // ---- 创意交互 ----
  // 漂浮金尘
  const sp = document.getElementById("sparkles");
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("i");
    s.className = "spark";
    s.style.left = Math.random() * 100 + "%";
    s.style.width = s.style.height = (2 + Math.random() * 3) + "px";
    s.style.animationDuration = (9 + Math.random() * 10) + "s";
    s.style.animationDelay = (-Math.random() * 12) + "s";
    sp.appendChild(s);
  }

  // ---- 书本翻页（封面 + 故事 12 页，绕书脊真实翻页） ----
  const bookPages = ["assets/pages/cover.jpg", ...CONFIG.pages.map(p => p.thumb)];
  let pg = 0, animating = false;
  const cover = document.getElementById("coverCard");
  const isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
  // 触摸设备：点按/触摸时才转正；闲置后回到斜放
  function faceFront(){ if (isTouch) cover.classList.add("front-facing"); }
  function faceBack(){ cover.classList.remove("front-facing"); cover.style.transform = ""; }
  const pageBack = document.getElementById("pageBack");
  const pageLeaf = document.getElementById("pageLeaf");
  const backImg = document.getElementById("backImg");
  const leafImg = document.getElementById("leafImg");
  const pgPrev = document.getElementById("pgPrev");
  const pgNext = document.getElementById("pgNext");

  function paint() {
    backImg.src = bookPages[pg];
    leafImg.src = bookPages[pg];
    pgPrev.disabled = pg === 0;
    pgNext.disabled = pg === bookPages.length - 1;
  }

  function turn(dir) {
    const target = pg + dir;
    if (animating || target < 0 || target > bookPages.length - 1) return;
    animating = true;
    backImg.src = bookPages[target];   // 翻完落下的目标页，垫在底层
    leafImg.src = bookPages[pg];       // 正在掀起的当前页
    pageLeaf.classList.remove("turn-next", "turn-prev");
    pageLeaf.style.visibility = "visible";
    void pageLeaf.offsetWidth;
    pageLeaf.classList.add(dir === 1 ? "turn-next" : "turn-prev");
    setTimeout(() => {
      pg = target;
      pageLeaf.classList.remove("turn-next", "turn-prev");
      pageLeaf.style.visibility = "hidden";
      paint();
      animating = false;
    }, 560);
  }
  const goNext = () => turn(1);
  const goPrev = () => turn(-1);
  pgNext.addEventListener("click", e => { e.stopPropagation(); goNext(); });
  pgPrev.addEventListener("click", e => { e.stopPropagation(); goPrev(); });
  document.getElementById("bookFront").addEventListener("click", e => {
    if (e.target.closest(".pg-btn")) return;
    const r = e.currentTarget.getBoundingClientRect();
    if (e.clientX - r.left > r.width / 2) goNext(); else goPrev();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") goNext();
    if (e.key === "ArrowLeft") goPrev();
  });
  paint();

  // 闲置 4 秒：自动回到封面，并恢复斜放角度
  let idleTimer = null;
  function goCover() {
    if (animating) { resetIdle(); return; }
    if (pg !== 0) { pg = 0; paint(); }
    faceBack();
  }
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(goCover, 3000);
  }
  ["click", "touchstart", "pointerdown", "mousemove", "keydown"].forEach(ev =>
    cover.addEventListener(ev, resetIdle, { passive: true }));
  // 触摸/点按书本时转正朝向
  ["pointerdown", "touchstart", "click"].forEach(ev =>
    cover.addEventListener(ev, faceFront, { passive: true }));
  resetIdle();

  // 封面卡 3D 倾斜（仅鼠标设备；翻页过程中保持当前角度）
  if (matchMedia("(pointer:fine)").matches) {
    cover.addEventListener("mousemove", e => {
      if (animating) return;
      const r = cover.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      cover.style.transform =
        `perspective(900px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateY(-4px)`;
    });
    cover.addEventListener("mouseleave", faceBack);
  }

  // 滚动显现
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add("on"); io.unobserve(en.target); }
  }), { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
