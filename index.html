<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title id="title">Sungai Tanaki · AR</title>
<style>
  :root{
    --bg:#0f1b2d; --bg2:#16263f; --card:#1e3354;
    --text:#eaf2ff; --muted:#a9c2e2; --accent:#5fd4e6; --accent2:#ffd166;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:17px}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
       line-height:1.6;font-size:1rem}
  .wrap{max-width:980px;margin:0 auto;padding:20px 18px 56px}
  .hero{text-align:center;padding:26px 0 10px}
  .badge{display:inline-block;background:var(--card);color:var(--accent);padding:7px 16px;border-radius:999px;
         font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
  h1{font-size:clamp(34px,9vw,60px);margin:16px 0 8px;line-height:1.08}
  h1 em{color:var(--accent);font-style:normal}
  .sub{color:var(--muted);font-size:1.05rem;max-width:620px;margin:0 auto}

  .actions{margin-top:22px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:15px 26px;border-radius:14px;text-decoration:none;font-weight:700;
       border:0;cursor:pointer;font-size:1.05rem}
  .btn-primary{background:var(--accent);color:#08222c}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid #3a5a8a}

  .stats{display:flex;gap:26px;justify-content:center;margin-top:26px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
  .stats b{display:block;color:var(--text);font-size:1.6rem;line-height:1.2}

  h2{font-size:clamp(22px,5.6vw,28px);margin:44px 0 6px}
  .lead{color:var(--muted);font-size:1rem;margin-bottom:14px}

  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
  .step{background:var(--card);border-radius:16px;padding:18px}
  .step .n{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#08222c;
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;margin-bottom:10px}
  .step b{font-size:1.05rem}
  .step p{color:var(--muted);margin-top:6px;font-size:.98rem}

  .langs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .lang{padding:12px 20px;border-radius:12px;background:var(--card);color:var(--text);
        border:1px solid transparent;font-weight:700;cursor:pointer;font-size:1rem;font-family:inherit}
  .lang.active{border-color:var(--accent);color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
  .cell{background:var(--card);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--text);
        display:block;aspect-ratio:3/4;position:relative}
  .cell .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            font-size:2.6rem;font-weight:700;color:#4f74a8}
  .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cell span{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(0,0,0,.68);padding:6px 10px;
             border-radius:999px;font-size:.9rem;font-weight:600;text-align:center;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  footer{margin-top:52px;color:var(--muted);font-size:.9rem;text-align:center;line-height:1.7}

  @media (max-width:640px){
    html{font-size:18px}
    .steps{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .actions{flex-direction:column;align-items:stretch}
    .btn{text-align:center}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="badge" data-i18n="badge">Augmented Reality Storybook</span>
    <h1 id="bookTitle">Sungai Tanaki</h1>
    <p class="sub" id="bookSub" data-i18n="sub"></p>
    <div class="actions">
      <a class="btn btn-primary" id="startBtn" href="ar.html" data-i18n="start">Start scanning</a>
      <a class="btn btn-ghost" id="viewBtn" href="viewer.html?page=1" data-i18n="view">No book? View in 3D</a>
    </div>
    <div class="stats">
      <div><b id="statPages">0</b> <span data-i18n="statPages">story pages</span></div>
      <div><b id="statLive">0</b> <span data-i18n="statLive">AR pages live</span></div>
      <div><b id="statLangs">0</b> <span data-i18n="statLangs">narration languages</span></div>
    </div>
  </div>

  <h2 data-i18n="pickLang">Pick a language</h2>
  <p class="lead" data-i18n="pickLangSub"></p>
  <div class="langs" id="langRow"></div>

  <h2 data-i18n="howTitle">How it works</h2>
  <div class="steps">
    <div class="step"><div class="n">1</div><b data-i18n="s1t"></b><p data-i18n="s1b"></p></div>
    <div class="step"><div class="n">2</div><b data-i18n="s2t"></b><p data-i18n="s2b"></p></div>
    <div class="step"><div class="n">3</div><b data-i18n="s3t"></b><p data-i18n="s3b"></p></div>
  </div>

  <h2 data-i18n="gridTitle">Every page, a small world</h2>
  <p class="lead" data-i18n="gridSub"></p>
  <div class="grid" id="grid"></div>

  <footer data-i18n="footer"></footer>
</div>

<script src="config.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") || localStorage.getItem("lang") || "en";
  if (!CONFIG.languages.some(l => l.code === lang)) lang = "en";

  const T = CONFIG.ui[lang] || CONFIG.ui.en;

  document.documentElement.lang = lang;
  document.title = CONFIG.bookTitle + " · AR";
  document.getElementById("bookTitle").innerHTML = CONFIG.bookTitle.replace(" ", " <em>") + "</em>";

  // 所有带 data-i18n 的元素一次填好
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = T[el.dataset.i18n];
    if (v) el.textContent = v;
  });

  document.getElementById("statPages").textContent = CONFIG.pages.length;
  document.getElementById("statLive").textContent = CONFIG.targetMap.length;
  document.getElementById("statLangs").textContent = CONFIG.languages.length;

  // 语言按钮：用该语言自己的名字
  const row = document.getElementById("langRow");
  CONFIG.languages.forEach(L => {
    const b = document.createElement("button");
    b.className = "lang" + (L.code === lang ? " active" : "");
    b.textContent = L.label + " · " + L.native;
    b.onclick = () => {
      localStorage.setItem("lang", L.code);
      location.href = "index.html?lang=" + L.code;
    };
    row.appendChild(b);
  });

  document.getElementById("startBtn").href = "ar.html?lang=" + lang;
  document.getElementById("viewBtn").href =
    "viewer.html?page=" + (CONFIG.targetMap[0] || 1) + "&lang=" + lang;

  const grid = document.getElementById("grid");
  const live = CONFIG.targetMap;
  CONFIG.pages.forEach((p, i) => {
    const num = i + 1;
    const a = document.createElement("a");
    a.className = "cell";
    a.href = "viewer.html?page=" + num + "&lang=" + lang;
    const label = T.pageWord + " " + num;
    a.innerHTML = `<div class="ph">${num}</div>
        <img src="${p.thumb}" alt="${label}" onerror="this.remove()"/>
        <span>${live.includes(num) ? "📷 " : ""}${num}. ${label}</span>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
